<!-- Navbar -->
<nav class="sticky top-0 z-40 flex items-center h-14 px-5 bg-white/90 backdrop-blur-md border-b border-pink-100 shadow-sm shadow-pink-100/50">

  <!-- Brand -->
  <a routerLink="/dashboard"
     class="flex items-center gap-3 no-underline select-none group">
    <div class="flex items-center justify-center w-7 h-7 rounded-lg bg-pink-500 text-white flex-shrink-0
                shadow-md shadow-pink-300/40 group-hover:shadow-pink-400/50 transition-shadow duration-200">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
    </div>
    <div class="flex items-baseline gap-2">
      <span class="text-slate-800 font-bold text-sm tracking-tight">ResqAlert</span>
      <span class="hidden sm:inline h-3.5 w-px bg-pink-200"></span>
      <span class="hidden sm:inline text-pink-400 text-[10px] font-semibold uppercase tracking-widest">{{ role }}</span>
    </div>
  </a>

  <!-- Right side -->
  <div class="ml-auto flex items-center gap-1.5">

    <!-- Settings Dropdown -->
    <div class="relative">
      <button
        (click)="toggleDropdown()"
        class="flex items-center gap-1.5 h-8 px-3 rounded-lg text-slate-500 hover:text-slate-700
               bg-transparent hover:bg-pink-50 border border-transparent hover:border-pink-200
               text-xs font-medium transition-all duration-150 select-none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span class="hidden sm:inline">Settings</span>
        <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round"
             class="opacity-40 transition-transform duration-150"
             [class.rotate-180]="dropdownOpen">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </button>

      <!-- Dropdown Panel -->
      <div *ngIf="dropdownOpen"
           class="absolute right-0 mt-1.5 w-56 rounded-xl border border-pink-100 bg-white shadow-xl shadow-pink-100/60 overflow-hidden z-50">

        <!-- Header -->
        <div class="flex items-center gap-2.5 px-4 py-3 border-b border-pink-50 bg-pink-50/50">
          <div class="w-7 h-7 rounded-full bg-pink-100 border border-pink-200 flex items-center justify-center flex-shrink-0">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-500">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </div>
          <div>
            <p class="text-xs font-semibold text-slate-700 leading-none">{{ role }}</p>
            <p class="text-[10px] text-slate-400 mt-0.5 leading-none">Signed in</p>
          </div>
        </div>

        <!-- Menu Items -->
        <div class="py-1.5">
          <button *ngIf="isLoggedIn"
                  (click)="openAccountDialog(); toggleDropdown()"
                  class="w-full flex items-center gap-3 px-4 py-2 text-[11px] font-medium text-slate-500
                         hover:text-slate-800 hover:bg-pink-50 transition-colors duration-100 text-left">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Change Credentials
          </button>

          <button *ngIf="isLoggedIn && canAccessFeedback()"
                  (click)="openFeedbackDialog(); toggleDropdown()"
                  class="w-full flex items-center gap-3 px-4 py-2 text-[11px] font-medium text-slate-500
                         hover:text-slate-800 hover:bg-pink-50 transition-colors duration-100 text-left">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            Submit Feedback
          </button>

          <div class="h-px bg-pink-50 mx-3 my-1.5"></div>

          <a href="#"
             class="flex items-center gap-3 px-4 py-2 text-[11px] font-medium text-slate-500
                    hover:text-slate-800 hover:bg-pink-50 transition-colors duration-100 no-underline">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400">
              <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            Help &amp; Support
          </a>
        </div>

        <!-- Sign out -->
        <div class="px-3 pb-2.5 pt-1 border-t border-pink-50">
          <button (click)="logout()"
                  class="w-full flex items-center gap-3 px-3 py-2 text-[11px] font-medium rounded-lg
                         text-red-400 hover:text-red-600 hover:bg-red-50
                         border border-transparent hover:border-red-100
                         transition-all duration-150">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sign out
          </button>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="h-5 w-px bg-pink-100 mx-1"></div>

    <!-- Logout button -->
    <button
      (click)="logout()"
      class="flex items-center gap-1.5 h-8 px-3 rounded-lg
             text-slate-400 hover:text-red-500
             bg-transparent hover:bg-red-50
             border border-transparent hover:border-red-100
             text-xs font-medium transition-all duration-150 select-none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span class="hidden sm:inline">Logout</span>
    </button>
  </div>
</nav>

<!-- Audio -->
<audio id="alert-audio" loop>
  <source src="alarm.mp3" type="audio/mpeg" />
</audio>

<!-- Emergency Alert Overlay -->
<div *ngIf="showNewReportNotification"
     class="fixed inset-0 z-[9999] flex flex-col items-center justify-center gap-4"
     style="background: rgba(255,241,245,0.96); backdrop-filter: blur(6px);">

  <div class="relative flex items-center justify-center">
    <span class="absolute inline-flex h-32 w-32 rounded-full bg-pink-400/20 animate-ping" style="animation-duration:1.2s;"></span>
    <span class="absolute inline-flex h-20 w-20 rounded-full bg-pink-400/30 animate-ping" style="animation-duration:0.9s;animation-delay:0.15s;"></span>
    <div class="relative z-10 flex items-center justify-center w-16 h-16 rounded-full bg-pink-500 shadow-2xl shadow-pink-300/60">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
  </div>

  <div class="text-center select-none mt-2">
    <p class="text-slate-800 font-black text-3xl tracking-tight">Emergency Alert</p>
    <p class="text-slate-500 text-sm font-medium mt-1.5">New incident report has been received</p>
    <div class="flex items-center justify-center gap-2 mt-3">
      <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-pulse"></span>
      <span class="text-pink-500 text-xs font-semibold uppercase tracking-widest">Live Incident</span>
      <span class="w-1.5 h-1.5 rounded-full bg-pink-500 animate-pulse"></span>
    </div>
  </div>

  <button (click)="dismissNotification()"
          class="mt-4 flex items-center gap-2 px-5 py-2.5 rounded-xl
                 bg-white hover:bg-pink-50 border border-pink-200 hover:border-pink-300
                 text-slate-600 hover:text-slate-800 text-sm font-medium shadow-sm
                 transition-all duration-150">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
    Dismiss Alert
  </button>

  <button (click)="dismissNotification()"
          class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-lg
                 bg-white hover:bg-pink-50 border border-pink-100 text-slate-400 hover:text-slate-600 transition-all duration-150">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</div>
