<!-- Top Navbar -->
<app-navbar [role]="role" [isLoggedIn]="true" (logoutEvent)="logout()"></app-navbar>

<!-- Main Layout -->
<div class="flex min-h-screen bg-pink-50/40">

  <!-- Sidebar -->
  <app-sidebar [role]="role"></app-sidebar>

  <!-- Content Area -->
  <main class="flex-1 p-6 space-y-6 overflow-auto">

    <!-- Page Header + Export -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">Admin Reports</h1>
        <p class="text-slate-400 text-sm mt-0.5">System-wide incident analytics and statistics</p>
      </div>

      <!-- Export Controls -->
      <div class="flex items-center gap-2">
        <span class="text-sm font-medium text-slate-500">Export:</span>
        <input type="month"
               [(ngModel)]="selectedMonth"
               class="bg-white border border-pink-200 text-slate-700 text-sm rounded-lg px-3 py-1.5
                      focus:outline-none focus:ring-1 focus:ring-pink-400 focus:border-pink-400
                      shadow-sm transition-colors">
        <button (click)="exportPDF()"
                class="flex items-center gap-2 px-4 py-1.5 bg-pink-500 hover:bg-pink-600 text-white text-sm
                       font-medium rounded-lg transition-colors duration-150 shadow-md shadow-pink-200">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Export PDF
        </button>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">

      <!-- Total -->
      <div class="bg-white border border-pink-100 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-semibold text-pink-400 uppercase tracking-widest">Total</span>
          <div class="w-7 h-7 rounded-lg bg-pink-50 flex items-center justify-center text-pink-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-slate-800">{{ totalReports }}</p>
        <p class="text-xs text-slate-400">All reports</p>
      </div>

      <!-- PNP -->
      <div class="bg-white border border-blue-100 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-semibold text-blue-400 uppercase tracking-widest">PNP</span>
          <div class="w-7 h-7 rounded-lg bg-blue-50 flex items-center justify-center text-blue-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-slate-800">{{ totalPNP }}</p>
        <p class="text-xs text-slate-400">Police reports</p>
      </div>

      <!-- BFP -->
      <div class="bg-white border border-amber-100 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-semibold text-amber-500 uppercase tracking-widest">BFP</span>
          <div class="w-7 h-7 rounded-lg bg-amber-50 flex items-center justify-center text-amber-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-slate-800">{{ totalBFP }}</p>
        <p class="text-xs text-slate-400">Fire reports</p>
      </div>

      <!-- MDRRMO -->
      <div class="bg-white border border-emerald-100 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-semibold text-emerald-500 uppercase tracking-widest">MDRRMO</span>
          <div class="w-7 h-7 rounded-lg bg-emerald-50 flex items-center justify-center text-emerald-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-slate-800">{{ totalMDRRMO }}</p>
        <p class="text-xs text-slate-400">Disaster reports</p>
      </div>

      <!-- Blocked -->
      <div class="bg-white border border-red-100 rounded-2xl p-4 shadow-sm space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-[10px] font-semibold text-red-400 uppercase tracking-widest">Blocked</span>
          <div class="w-7 h-7 rounded-lg bg-red-50 flex items-center justify-center text-red-500">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/>
            </svg>
          </div>
        </div>
        <p class="text-2xl font-bold text-slate-800">{{ totalBlocked }}</p>
        <p class="text-xs text-slate-400">Blocked numbers</p>
      </div>

    </div>

    <!-- Monthly Line Chart -->
    <div class="bg-white border border-pink-100 rounded-2xl p-6 shadow-sm">
      <div class="flex items-center gap-2 mb-5">
        <div class="w-1 h-5 rounded-full bg-pink-500"></div>
        <h2 class="text-xs font-semibold text-slate-500 tracking-widest uppercase">Monthly Reports</h2>
      </div>
      <canvas baseChart
              [data]="monthlyLineChartData"
              [type]="'line'"
              [options]="monthlyLineChartOptions"
              class="w-full"
              style="height: 300px;">
      </canvas>
    </div>

  </main>
</div>
